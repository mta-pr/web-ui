[project]
name = "mta-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "syncro128", email = "git@auto.syn128.net" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.3",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[project.scripts]
server = "mta_project.mta_server:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.89",
]
test = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
