<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Вход · MTA Monitor</title>
    <style>

        * {
            box-sizing: border-box
        }

        body {
            margin:      0;
            min-height:  100vh;
            display:     grid;
            place-items: center;
            background:  #0c1421;
            color:       #eef4ff;
            font-family: system-ui,Segoe UI,sans-serif;
            padding:     18px
        }

        main {
            width:         min(420px,100%);
            background:    #152235;
            border:        1px solid #30445f;
            border-radius: 18px;
            padding:       32px;
            box-shadow:    0 24px 70px #050a1399
        }

        h1 {
            text-align: center;
            font-size:  28px;
            margin:     0 0 8px
        }

        .sub {
            text-align: center;
            color:      #a7b8cd;
            margin:     0 0 30px;
            font-size:  14px
        }

        label {
            display:   block;
            margin:    16px 0 7px;
            color:     #b7cbe0;
            font-size: 14px
        }

        input {
            width:         100%;
            padding:       14px;
            border:        1px solid #435773;
            border-radius: 10px;
            background:    #0e1a2b;
            color:         white;
            font-size:     16px
        }

        input:focus {
            outline: 2px solid #4b96e0
        }

        button {
            width:         100%;
            margin-top:    26px;
            padding:       14px;
            border:        0;
            border-radius: 10px;
            background:    #3275b8;
            color:         white;
            font-weight:   700;
            font-size:     16px;
            cursor:        pointer
        }

        .err {
            padding:       12px;
            border-radius: 9px;
            background:    #542b35;
            color:         #ffd2da;
            margin:        12px 0
        }

        footer {
            text-align: center;
            color:      #8198b2;
            font-size:  12px;
            margin-top: 25px
        }

    </style>
</head>

<body>
    <main>
        <h1>◉ MTA Monitor</h1>
        <p class="sub">Панель управления торговыми автоматами</p>
        {{ error_placeholder | safe }}
        <form action="/login" method="post" autocomplete="on"><label for="username">Логин</label><input id="username" name="username" value="admin" autocomplete="username" required>
            <label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Войти в систему</button></form>
        <footer>Доступ только для авторизованных операторов</footer>
    </main>
</body>

</html>
